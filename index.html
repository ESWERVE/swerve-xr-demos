<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050507" />
  <meta name="description" content="SWERVE XR DEMOS — experimental spatial worlds." />
  <title>SWERVE XR DEMOS</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, rgba(99, 73, 168, .16), transparent 34rem),
        #050507;
      color: #f4f2fa;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .3;
      background-image: radial-gradient(#ffffff 0.55px, transparent 0.75px);
      background-size: 27px 27px;
      mask-image: radial-gradient(circle, #000 0%, transparent 72%);
    }
    main { width: min(90vw, 52rem); padding: 3rem 1.5rem; text-align: center; }
    .signal { margin: 0 0 1.4rem; color: #aa91ec; font-size: .72rem; letter-spacing: .28em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.4rem, 8vw, 6.8rem); font-weight: 500; line-height: .88; letter-spacing: -.075em; }
    .rule { width: 4.5rem; height: 1px; margin: 2.4rem auto; background: linear-gradient(90deg, transparent, #a78bea, transparent); }
    p { margin: 0 auto; max-width: 35rem; color: #bdb8c8; font-size: clamp(.8rem, 2vw, .96rem); line-height: 1.8; letter-spacing: .05em; }
    .status { margin-top: 2rem; color: #716c7b; font-size: .68rem; letter-spacing: .2em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <p class="signal">Spatial transmission initialized</p>
    <h1>SWERVE<br />XR DEMOS</h1>
    <div class="rule"></div>
    <p>Experimental worlds built to answer one question: does a spatial idea produce a feeling when you walk through it?</p>
    <p class="status">World 001 awaiting signal</p>
  </main>
</body>
</html>
